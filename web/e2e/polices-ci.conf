<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  #583: the CI font on a workstation, to regenerate the reference captures (web/e2e/screenshots/).
  Use (in web/): FONTCONFIG_FILE="$PWD/e2e/polices-ci.conf" npm run e2e (or node scripts/porte.mjs),
  after checking « fc-match sans-serif » and « fc-match system-ui » give DejaVu Sans.
  A19: the system configuration is INCLUDED (antialiasing, hinting: the CI's rendering), and the
  fonts the runner does not have are rejected, here Inter; add the one your workstation prefers.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Variable</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
