name: Changer la phrase de passe

# 1. Ajoutez le secret NEW_DATA_PASSPHRASE (la nouvelle phrase).
# 2. Lancez ce workflow : toutes les données sont rechiffrées et la robustesse est vérifiée.
# 3. Remplacez la valeur du secret DATA_PASSPHRASE par la nouvelle phrase, puis supprimez
#    NEW_DATA_PASSPHRASE. Entre les étapes 2 et 3, la collecte de la nuit échouerait.
on:
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # S-1.16 #265: locked versions with hashes, and no secret in this step's environment
      # (a compromised package would run here). The collector runs from the checkout, not installed.
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Rechiffrement
        env:
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          NEW_DATA_PASSPHRASE: ${{ secrets.NEW_DATA_PASSPHRASE }}
        run: python -m collector rekey
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: changement de phrase de passe"
          git push
      - name: Étape suivante
        run: |
          echo "## Données rechiffrées" >> "$GITHUB_STEP_SUMMARY"
          echo "Remplacez maintenant le secret **DATA_PASSPHRASE** par la nouvelle phrase, puis supprimez **NEW_DATA_PASSPHRASE**." >> "$GITHUB_STEP_SUMMARY"
