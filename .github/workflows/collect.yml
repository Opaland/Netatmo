name: Collecte quotidienne

on:
  schedule:
    # 04:17 UTC (≈ 5-6 h à Paris) : les données de la veille sont disponibles après 2 h.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Récupérer tout l'historique disponible"
        type: boolean
        default: false
      inventaire:
        description: "Après la collecte, inventaire anonyme de la station Netatmo : champs, types, échelles (S-1.19)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A stuck request or a long Retry-After never holds the runner (and the secrets) for hours.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      # S-13.2: read the encrypted hourly snapshots (artifacts of « Relevé horaire »).
      actions: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    # S-1.16 #265: no job-level env. Secrets and private variables are given only to the step
    # « Collecte », the one that needs them (never to pip, gh or git).
    steps:
      - id: check
        env:
          # "true" / "false" only: the values themselves are not exposed to this step.
          CONFIGURED: ${{ secrets.INTUIS_USERNAME != '' && secrets.DATA_PASSPHRASE != '' }}
        run: |
          if [ "$CONFIGURED" != "true" ]; then
            echo "::notice::Secrets non configurés : voir le README (section Installation). Collecte ignorée."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-python@v7
        if: steps.check.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # S-1.16 #265: locked versions with hashes, and no secret in this step's environment
      # (a compromised package would run here). The collector runs from the checkout, not installed.
      - if: steps.check.outputs.configured == 'true'
        run: pip install --require-hashes -r requirements-lock.txt
      # S-13.2: encrypted hourly snapshots, kept 3 days as artifacts, never committed.
      # Already counted hours are skipped by the collector, so reading a snapshot twice is harmless.
      # S-1.16 #271: only artifacts of this repository's own « Relevé horaire » runs (schedule or
      # manual run) on the default branch; never one uploaded by a pull request or a fork.
      - name: Relevés horaires des pièces
        if: steps.check.outputs.configured == 'true' && vars.ROOM_STATE_HOURLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: ${{ runner.temp }}/etat
        run: |
          mkdir -p "$DEST"
          n=0
          # Never fatal: on an API error no snapshot is read (the collector reports it).
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch) || branch=main
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/releve-horaire.yml/runs?branch=$branch&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_repository.id == .repository.id)
                   | select(.event == "schedule" or .event == "workflow_dispatch") | .id]') || runs='[]'
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[]' \
            | jq -r --argjson runs "$runs" --arg branch "$branch" '
                select(.expired | not) | select((.name // "") | startswith("etat-pieces-"))
                | select(.workflow_run.head_branch == $branch)
                | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                | select(.workflow_run.id as $r | $runs | index($r)) | .id') || ids=""
          for id in $ids; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/etat.zip" \
              && unzip -o -q "$RUNNER_TEMP/etat.zip" -d "$DEST/$id"; then
              n=$((n + 1))
            else
              echo "::warning::Un relevé horaire illisible a été ignoré"
            fi
          done
          echo "$n relevés horaires téléchargés"
          echo "ROOM_STATE_DIR=$DEST" >> "$GITHUB_ENV"
      - name: Collecte
        id: collect
        if: steps.check.outputs.configured == 'true'
        env:
          INTUIS_USERNAME: ${{ secrets.INTUIS_USERNAME }}
          INTUIS_PASSWORD: ${{ secrets.INTUIS_PASSWORD }}
          INTUIS_CLIENT_ID: ${{ secrets.INTUIS_CLIENT_ID }}
          INTUIS_CLIENT_SECRET: ${{ secrets.INTUIS_CLIENT_SECRET }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          INTUIS_ROOM_CATEGORIES: ${{ vars.INTUIS_ROOM_CATEGORIES }}
          # S-12.1: contract shared between devices (not secret: a repository variable written by
          # Settings). Validated by the collector, stored in the encrypted meta, never printed.
          CONTRACT_JSON: ${{ vars.CONTRACT_JSON }}
          # #346: radiators switched off on purpose (stove…), set from ⚙ Mon logement: no alert.
          STOPPED_ROOMS_JSON: ${{ vars.STOPPED_ROOMS_JSON }}
          WOOD_JSON: ${{ vars.WOOD_JSON }}
          # S-12.5: prolonged cold alert (rooms and threshold, disabled when unset). Never printed:
          # the issue below only carries pseudonyms (Pièce A, B…), the log only counts.
          COLD_ALERT_JSON: ${{ vars.COLD_ALERT_JSON }}
          # S-1.14: optional caps on API calls per collection (empty = default, see docs/api-notes.md).
          MAX_CALLS_INTUIS: ${{ vars.MAX_CALLS_INTUIS }}
          MAX_CALLS_INTUIS_30MIN: ${{ vars.MAX_CALLS_INTUIS_30MIN }}
          MAX_CALLS_NETATMO: ${{ vars.MAX_CALLS_NETATMO }}
          MAX_CALLS_LINKY: ${{ vars.MAX_CALLS_LINKY }}
          MAX_CALLS_OPEN_METEO: ${{ vars.MAX_CALLS_OPEN_METEO }}
          MAX_CALLS_SHELLY: ${{ vars.MAX_CALLS_SHELLY }}
          # Optional: Netatmo weather station (see README)
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          # Optional: Linky meter through Conso API (see README)
          ENEDIS_TOKEN: ${{ secrets.ENEDIS_TOKEN }}
          ENEDIS_PRM: ${{ secrets.ENEDIS_PRM }}
          # Optional: Shelly smart plugs through the Shelly Cloud (see README)
          SHELLY_AUTH_KEY: ${{ secrets.SHELLY_AUTH_KEY }}
          SHELLY_SERVER: ${{ secrets.SHELLY_SERVER }}
          # Optional: monthly analysis written by Claude (see README)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # S-13.5: presence hours per day, opt-in only (see README)
          ROOM_STATE_PRESENCE: ${{ vars.ROOM_STATE_PRESENCE }}
          # S-11.4 (#220): noisy hours of the living room per day, opt-in only (see README)
          STATION_NOISE: ${{ vars.STATION_NOISE }}
          RENEW_FILE: ${{ runner.temp }}/renew.txt
          COLD_FILE: ${{ runner.temp }}/cold.txt
          # v1.5 (#214, #215): modules not answering, low station battery (types and dates only).
          DEVICE_FILE: ${{ runner.temp }}/devices.txt
          # S-1.19: station inventory with the access token of this collection (names and counts only).
          STATION_INVENTORY: ${{ inputs.inventaire && 'true' || '' }}
        run: python -m collector -v ${{ inputs.backfill && 'backfill' || 'sync' }}
      # #262: the push is retried (fetch + rebase) when main moved during the collection.
      - name: Commit des données chiffrées
        id: commit
        if: steps.check.outputs.configured == 'true'
        run: |
          scripts/commit-data.sh "data: collecte du $(date -u +%Y-%m-%d)" data/
      # #262: Netatmo rotates its refresh token at every login and the collector writes the new
      # one to data/ at once. When the collection or the commit above failed, it is still
      # committed here: otherwise the next run would reuse a consumed token (invalid_grant).
      - name: Sauvegarde du jeton Netatmo renouvelé
        if: always() && steps.check.outputs.configured == 'true' && steps.commit.outcome != 'success'
        run: |
          scripts/commit-data.sh "data: jeton Netatmo renouvelé ($(date -u +%Y-%m-%d))" data/netatmo-token.enc.json

      # One open issue while the collection fails (GitHub e-mails the owner), closed on success.
      - name: Alerte en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ La collecte quotidienne échoue"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec le $(date -u +%F) : $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "@${{ github.repository_owner }} la collecte du $(date -u +%F) a échoué : $run_url

          Causes fréquentes : mot de passe Intuis changé (mettre à jour le secret INTUIS_PASSWORD), serveur Intuis indisponible (réessayer plus tard), changement de l'API (lancer Actions → Diagnostic).
          Cette issue se fermera toute seule à la prochaine collecte réussie."
          fi
      - name: Fermeture de l'alerte
        if: success() && steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ La collecte quotidienne échoue"
          for num in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Collecte rétablie le $(date -u +%F)."
          done

      # S-1.12: one open issue while a token must be renewed (refused, or expiring within 30 days),
      # closed when nothing is left. renew.txt holds source names and dates only, never a value.
      - name: Alerte jetons à renouveler
        if: success() && steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RENEW_FILE: ${{ runner.temp }}/renew.txt
        run: |
          title="🔑 Jeton à renouveler"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -s "$RENEW_FILE" ]; then
            body="$(cat "$RENEW_FILE")"
            if [ -z "$num" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "@${{ github.repository_owner }} un jeton ou un consentement doit être renouvelé :

          $body

          Paramètres de l'application affiche la date d'expiration de chaque source. Cette issue se fermera toute seule quand plus rien ne sera à renouveler."
            else
              # Comment only when the list changed, not every night.
              last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // empty')
              [ -n "$last" ] || last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq .body)
              case "$last" in
                *"$body"*) echo "Alerte déjà ouverte (#$num), inchangée." ;;
                *) gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Mise à jour du $(date -u +%F) :

          $body" ;;
              esac
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Plus aucun jeton à renouveler le $(date -u +%F)."
          fi

      # S-12.5: one open issue while a followed room stays below its threshold, closed when none
      # is. cold.txt holds pseudonyms and day counts only, never a room name or a temperature.
      - name: Alerte froid prolongé
        if: success() && steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COLD_FILE: ${{ runner.temp }}/cold.txt
        run: |
          title="🥶 Alerte froid prolongé"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -s "$COLD_FILE" ]; then
            body="$(cat "$COLD_FILE")"
            if [ -z "$num" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "@${{ github.repository_owner }} une pièce suivie est restée sous le seuil choisi :

          $body

          L'application (Paramètres → Alerte froid prolongé) indique quelle pièce correspond à chaque pseudonyme. Avec une collecte par nuit, l'alerte peut arriver jusqu'à 24 h après la journée froide : ce n'est pas un dispositif de sécurité. Cette issue se fermera toute seule au retour au-dessus du seuil."
            else
              last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // empty')
              [ -n "$last" ] || last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq .body)
              case "$last" in
                *"$body"*) echo "Alerte froid déjà ouverte (#$num), inchangée." ;;
                *) gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Mise à jour du $(date -u +%F) :

          $body" ;;
              esac
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Plus aucune pièce suivie sous le seuil le $(date -u +%F)."
          fi

      # v1.5 (#214, #215): optional (repository variable DEVICE_ALERT=true). One open issue while a
      # radiator, relay, water heater or gateway does not answer, or a station battery is low;
      # closed when none is. devices.txt holds module types, counts and dates only.
      - name: Alerte appareil injoignable
        if: success() && steps.check.outputs.configured == 'true' && vars.DEVICE_ALERT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_FILE: ${{ runner.temp }}/devices.txt
        run: |
          title="📡 Appareil injoignable ou pile faible"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -s "$DEVICE_FILE" ]; then
            body="$(cat "$DEVICE_FILE")"
            if [ -z "$num" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "@${{ github.repository_owner }} un appareil ne répond plus ou une pile faiblit :

          $body

          L'application (Paramètres → État des appareils) indique la pièce et le module concernés. Cette issue se fermera toute seule quand tout répondra de nouveau."
            else
              last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // empty')
              [ -n "$last" ] || last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq .body)
              case "$last" in
                *"$body"*) echo "Alerte appareil déjà ouverte (#$num), inchangée." ;;
                *) gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Mise à jour du $(date -u +%F) :

          $body" ;;
              esac
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Tous les appareils répondent le $(date -u +%F)."
          fi

  # A push made with GITHUB_TOKEN does not trigger other workflows: deploy explicitly.
  deploy:
    needs: collect
    if: needs.collect.outputs.configured == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write # S-8.10: provenance attestation of the deployed site
    uses: ./.github/workflows/deploy.yml
