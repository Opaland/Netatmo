name: Diagnostic

# Anonymous: prints module type codes and, per measure type, the number of days with
# data. No names, ids or energy values (the log of a public repository is public).
on:
  workflow_dispatch:
    inputs:
      history:
        description: "Tester la profondeur d'historique (jour / semaine / mois)"
        type: boolean
        default: false
      probe_history:
        description: "Chercher un historique des fenêtres / boost (types de mesure candidats, S-13.1)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      INTUIS_USERNAME: ${{ secrets.INTUIS_USERNAME }}
      INTUIS_PASSWORD: ${{ secrets.INTUIS_PASSWORD }}
      INTUIS_CLIENT_ID: ${{ secrets.INTUIS_CLIENT_ID }}
      INTUIS_CLIENT_SECRET: ${{ secrets.INTUIS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m collector diagnose ${{ inputs.history && '--history' || '' }} ${{ inputs.probe_history && '--probe-history' || '' }}
