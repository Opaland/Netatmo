name: Diagnostic

# Anonymous: prints module type codes and, per measure type, the number of days with
# data. No names, ids or energy values (the log of a public repository is public).
on:
  workflow_dispatch:
    inputs:
      history:
        description: "Tester la profondeur d'historique (jour / semaine / mois)"
        type: boolean
        default: false
      probe_history:
        description: "Chercher un historique des fenêtres / boost (types de mesure candidats, S-13.1)"
        type: boolean
        default: false
      inventory:
        description: "Inventaire des données Intuis et Linky : champs, types, échelles, profondeur (S-1.19)"
        type: boolean
        default: false
      qualite:
        description: "Bilan qualité des données (archive chiffrée : nombres par mois, sans valeurs ni noms, S-1.32)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # S-1.16 #265: locked versions with hashes, and no secret in this step's environment
      # (a compromised package would run here). The collector runs from the checkout, not installed.
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Diagnostic
        # Skipped when only « Bilan qualité » is checked (it needs no Intuis call).
        if: ${{ !inputs.qualite || inputs.history || inputs.probe_history || inputs.inventory }}
        env:
          INTUIS_USERNAME: ${{ secrets.INTUIS_USERNAME }}
          INTUIS_PASSWORD: ${{ secrets.INTUIS_PASSWORD }}
          INTUIS_CLIENT_ID: ${{ secrets.INTUIS_CLIENT_ID }}
          INTUIS_CLIENT_SECRET: ${{ secrets.INTUIS_CLIENT_SECRET }}
          # Inventory only (S-1.19): Intuis + Linky. The Netatmo station is inventoried by
          # « Collecte quotidienne » (input « inventaire »), the only job that can save its rotating
          # refresh token.
          ENEDIS_TOKEN: ${{ inputs.inventory && secrets.ENEDIS_TOKEN || '' }}
          ENEDIS_PRM: ${{ inputs.inventory && secrets.ENEDIS_PRM || '' }}
        run: python -m collector diagnose ${{ inputs.history && '--history' || '' }} ${{ inputs.probe_history && '--probe-history' || '' }} ${{ inputs.inventory && '--inventory' || '' }}
      # S-1.32 (#336): reads data/ from the checkout, no API call. DATA_PASSPHRASE only in this step and
      # only when the box is checked; the command prints counts only (redact.register hides the value).
      - name: Bilan qualité des données
        if: ${{ inputs.qualite }}
        env:
          DATA_PASSPHRASE: ${{ inputs.qualite && secrets.DATA_PASSPHRASE || '' }}
          # #346 / #440: rooms switched off on purpose are « arrêtés », not missing (only their count is printed)
          # #459: a secret sealed in the app; the old plaintext variable until it is migrated
          STOPPED_ROOMS_JSON: ${{ inputs.qualite && secrets.STOPPED_ROOMS_JSON || '' }}
          # #502: the plaintext variable as narrowly as the secret (only the quality report reads it)
          STOPPED_ROOMS_JSON_VARIABLE: ${{ inputs.qualite && vars.STOPPED_ROOMS_JSON || '' }}
        run: python -m collector diagnose --qualite
