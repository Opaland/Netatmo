name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

# Least privilege: nothing at the workflow level, each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    permissions:
      contents: read
      id-token: write # S-8.10: OIDC token to sign the provenance attestation (Sigstore)
      attestations: write # S-8.10: store the attestation in the repository
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # pick up the data commit made earlier in the same run
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Tarifs réglementés à jour (CRE, open data)
        run: |
          for f in Option_HPHC Option_Base Option_Tempo; do
            curl -fsSL --max-time 30 "https://www.cre.fr/fileadmin/Documents/Open_data/Marches_de_detail/$f.csv" -o "/tmp/$f.csv" \
              && head -1 "/tmp/$f.csv" | grep -q PART_FIXE_TTC \
              && cp "/tmp/$f.csv" "web/public/tarifs/$f.csv" \
              || echo "::warning::Tarifs CRE $f injoignables : copie du dépôt utilisée"
          done
      - name: Couleurs des jours Tempo (données publiques)
        run: python3 scripts/tempo_jours.py || true
      - run: npm run build
        working-directory: web
      - name: Ajout des données chiffrées
        run: |
          if [ -f data/keyinfo.json ]; then cp -r data web/dist/data; fi
      # S-8.10: SHA-256 of every served file (SHA256SUMS, published with the site), then
      # build.json (commit, date, run, digest of SHA256SUMS) shown in Paramètres.
      - name: Empreintes SHA-256 et version déployée
        id: version
        working-directory: web/dist
        run: |
          find . -type f ! -path '*/.*' ! -name SHA256SUMS ! -name build.json -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          manifest=$(sha256sum SHA256SUMS | cut -d' ' -f1)
          printf '{"commit":"%s","date":"%s","repo":"%s","run":"%s","manifest":"%s"}\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$manifest" > build.json
          echo "### Empreintes publiées" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256SUMS : \`$manifest\` ($(wc -l < SHA256SUMS) fichiers)" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      # S-8.10: provenance attestation for the Pages artifact (artifact.tar), the manifest and
      # every served file, so `gh attestation verify` works on any file downloaded from the site.
      - name: Sujets de l'attestation
        run: |
          {
            sed 's#  #  site/#' web/dist/SHA256SUMS
            (cd web/dist && sha256sum SHA256SUMS build.json | sed 's#  #  site/#')
            (cd "$RUNNER_TEMP" && sha256sum artifact.tar)
          } > "$RUNNER_TEMP/subjects.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # #357 (part of #353): the published site, in the demo only: build.json reaches the deployed
  # commit, manifest (id, shortcuts, maskable icon) and sw.js served, the worker controls the
  # page, the demo opens without a JavaScript error nor a file in 4xx. No capture, no artefact.
  site-en-ligne:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node e2e/en-ligne.mjs
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
