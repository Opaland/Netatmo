name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # S-1.16 #265: the lock used by the collection workflows must install with its hashes;
      # the tests then run against those exact versions (plus the dev tools).
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run size # S-7.10, #227 : budget de taille du premier écran, entrée + préchargés (gzip)

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - run: npm run e2e:features # v1.4: facture, travaux, export recherche, clé effacée
      - run: npm run e2e:hauteurs # v2.3 #556 : hauteur de chaque écran de la revue (360 px, 200 %, DejaVu Sans), limites et marges
      - run: npm run e2e:composants # v1.6 #310 : page de démonstration des composants (axe, 200 %, 44 px)
      - run: npm run e2e:compteur # v1.6 #301 : onglet Compteur (période, « Compté : », 360 px 200 %, axe clair/sombre/contraste)
      - run: npm run e2e:proche # v1.6 #312, #316 : premier lancement et vue Proche
      - run: npm run e2e:piece # v1.6 #313 : liste Pièces et page Pièce (axe, 200 %, vue foyer)
      - run: npm run e2e:expliquer # v1.6 #337, #346 : expliquer un mois, pièce hors ligne (axe, 360 px 200 %)
      - run: npm run e2e:retours # v1.6 retours : module « Cave » liable à une chambre, télétravail 0 à 5 jours
      - run: npm run e2e:plannings # v1.6 #211, #210 : plannings et heures creuses, absences reconstituées (axe, 200 %)
      - run: npm run e2e:pwa # v1.6 #357 : nouvelle version en attente + bandeau, deux onglets, « Recharger l'application », Installer, hors ligne
      - run: npm run e2e:reglages # v1.6 #20, #370 : feuille « Réglages du graphique » (axe, 360 px 200 %, focus, réglages gardés)
      - run: npm run e2e:logement # v1.8 #462 : saisies gardées dans ⚙ Mon logement (localisation, bois, surfaces)
      - run: npm run e2e:jeton # v1.8 #463 : erreur du jeton nommée, effacée à chaque essai, « Réessayer »
      - run: npm run e2e:assistant # v2.0 #40 : assistant de premier lancement (GitHub simulé, démo, écran sans données)
      - run: npm run e2e:http # v2.0 #524 : ouverte en HTTP hors localhost, l'écran de déverrouillage le dit
      - run: npm run e2e:plan # v2.1 #202 : plan de la maison (lecture, tableau, vue foyer, 200 %, axe)
      - run: npm run e2e:plan-edition # v2.1 #202 : éditeur du plan (glisser au doigt, champs, brouillon scellé, 200 %, axe)
      # #353 : balayage systématique (chaque route × fixtures de démo × 360 px, 1280 px, 200 %, sombre ;
      # vue Proche à 360 px et à 200 %, #451)
      # puis explorateur de contrôles. Les fixtures (données fictives) sont générées dans dist/,
      # jamais publiées ; le collecteur tourne depuis le dépôt, versions verrouillées avec hashes.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r ../requirements-lock.txt
      - run: python -m collector fixtures -o web/dist/demo-fixtures
        working-directory: .
      - run: npm run e2e:trous # v2.4 #570 : trous d'un vrai compte (forme seule) : jamais 0, « incomplet », comparaisons sans le trou
      - run: npm run e2e:sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-demo
          path: web/e2e/screenshots
          retention-days: 7

  # S-7.9: Safari iOS. WebKit (moteur de Safari) en iPhone 13 : les cinq vues de la démo,
  # la clé effacée par iOS, les écrans v1.4, tous les parcours qui savent y tourner (#596) et le
  # balayage en portée réduite (#595).
  e2e-webkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npm run e2e:features
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:piece
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:reglages
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:logement
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:jeton
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:assistant
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:http
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:plan
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:plan-edition
        env:
          E2E_BROWSER: webkit
      # #596 : les parcours qui savent tourner dans WebKit y tournent tous (un test refuse un script qui
      # lit E2E_BROWSER sans être ici : src/e2e-webkit.test.ts) ; ce que le WebKit de Playwright ne permet
      # pas est dit en tête du script, avec sa raison mesurée.
      - run: npm run e2e # démo : tout sauf le hors-ligne par le service worker (en-tête de demo.mjs) ; un échec connu, #605
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:hauteurs # mesure et écrit les hauteurs en WebKit, sans juger les limites (mesurées en Chromium)
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:composants
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:compteur
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:proche
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:expliquer
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:retours
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:plannings
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:pwa # deux échecs connus en WebKit, #604 et #606
        env:
          E2E_BROWSER: webkit
      # #595 : le balayage dans WebKit (A18 : un débordement propre à WebKit), portée réduite écrite
      # dans e2e/sweep.mjs (WEBKIT_SCOPE_RUNS × WEBKIT_SCOPE_DISPLAYS : la démo à 360 px et 200 %,
      # trous-reels à 360 px), mêmes invariants et même auto-contrôle. Fixtures fictives dans dist/.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r ../requirements-lock.txt
      - run: python -m collector fixtures -o web/dist/demo-fixtures
        working-directory: .
      - run: npm run e2e:trous # #596 : trous d'un vrai compte (forme seule), comme dans le job e2e
        env:
          E2E_BROWSER: webkit
      - run: npm run e2e:sweep
        env:
          E2E_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-webkit
          path: web/e2e/screenshots
          retention-days: 7
