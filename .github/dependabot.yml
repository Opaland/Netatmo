version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["dette"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: ["dette"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dette"]
