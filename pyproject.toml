[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intuis-history-collector"
version = "0.1.0"
description = "Archive la consommation des radiateurs et du chauffe-eau Intuitiv with Netatmo (Muller / Intuis)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "cryptography>=42", "argon2-cffi>=25.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=2.6"]
ai = ["anthropic>=2.6"]

[tool.setuptools]
packages = ["collector"]

[tool.setuptools.package-data]
collector = ["kdf.json"]  # #139: KDF bounds shared with the app

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# #363: the tests that call the real public sources (tests/test_sources_reelles.py) are excluded by
# default; `pytest -m reseau` runs them (workflow « Sources publiques »).
addopts = '-m "not reseau"'
markers = ["reseau: appelle une vraie source publique sans clé (Open-Meteo, CRE, Tempo) ; hors CI bloquante"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]
